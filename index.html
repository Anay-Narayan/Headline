button.pri{background:var(--acc);color:#fff}
button:disabled{opacity:.5}
.ask{display:flex;gap:8px;margin:6px 0 4px}

.card.on{outline:4px solid var(--acc)}
.tag{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.card h3{margin:0;font-size:17px;line-height:1.3}
.card p{margin:0;font-size:14px;color:var(--mut)}
.src{font-size:12px;color:var(--mut)}
.card .row{margin-top:auto}

:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
.aiopt{display:block;font-size:12px;color:var(--mut);margin:0 0 10px}
.note{font-size:12px;color:var(--mut);margin:24px 0 8px}

function renderCards(){$("grid").innerHTML="";STORIES.forEach(function(s,i){var d=document.createElement("div");d.className="card";
 d.innerHTML='<div class="tag"></div><h3></h3><p></p><div class="src"></div><div class="row"><button>🐦 Tell me</button><button>Read original ↗</button><button>Real or fake?</button></div>';
 d.querySelector(".tag").textContent=s.tag;d.querySelector("h3").textContent=s.t;d.querySelector("p").textContent=s.s;var sr=d.querySelector(".src");sr.textContent="Source: "+s.src;if(s.url&&/^https?:/.test(s.url)){var al=document.createElement("a");al.href=s.url;al.target="_blank";al.rel="noopener";al.textContent=" · Read original ↗";al.style.color="var(--acc)";sr.appendChild(al)}
 var b=d.querySelectorAll("button");
 b[0].onclick=function(){playing=false;$("play").textContent="▶ Tell me the news";goTop();tell(i)};
 b[1].onclick=function(){if(s.url&&/^https?:/.test(s.url))window.open(s.url,"_blank","noopener")};
 b[2].onclick=function(){idx=i;mark();verify(i)};
 $("grid").appendChild(d)})}
var GN_ED="hl=en-US&gl=US&ceid=US:en";   /* Google News edition: e.g. hl=en-IN&gl=IN&ceid=IN:en for India */
var FEEDS=[
 {name:"BBC News",outlet:"BBC",tag:"World",url:"https://feeds.bbci.co.uk/news/world/rss.xml"},
 {name:"Al Jazeera",outlet:"Al Jazeera",tag:"World",url:"https://www.aljazeera.com/xml/rss/all.xml"},
 {name:"The Guardian",outlet:"The Guardian",tag:"World",url:"https://www.theguardian.com/world/rss"},
 {name:"NPR",outlet:"NPR",tag:"World",url:"https://feeds.npr.org/1004/rss.xml"},
 {name:"DW",outlet:"DW",tag:"World",url:"https://rss.dw.com/rdf/rss-en-world"},
 {name:"The Hindu",outlet:"The Hindu",tag:"World",url:"https://www.thehindu.com/news/international/feeder/default.rss"},
 {name:"BBC Technology",outlet:"BBC",tag:"Tech",url:"https://feeds.bbci.co.uk/news/technology/rss.xml"},
 {name:"BBC Science",outlet:"BBC",tag:"Science",url:"https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"},
 {name:"Google News",outlet:"Google News",tag:"World",gn:true,url:"https://news.google.com/rss/headlines/section/topic/WORLD?"+GN_ED}
];
/* Browsers can't read most news feeds directly, so we go through free public "CORS" helpers.
   If one is down, the next is tried. Edit this list if a service changes. */
var PROXIES=[
 {direct:true,make:function(u){return u}},
 {json:true,make:function(u){return "https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(u)}},
 {make:function(u){return "https://api.allorigins.win/raw?url="+encodeURIComponent(u)}},
 {make:function(u){return "https://corsproxy.io/?url="+encodeURIComponent(u)}}
];
var CACHE_KEY="headline_cache_v1",MAX_AGE=30*60000,KEEP=5*864e5;
function txt(h){try{return new DOMParser().parseFromString(String(h||""),"text/html").body.textContent.replace(/\s+/g," ").trim()}catch(e){return ""}}
function pdate(v){if(!v)return Date.now();v=String(v).trim();if(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(v))v=v.replace(" ","T")+"Z";var t=Date.parse(v);return isNaN(t)?Date.now():t}
function mk(f,t,l,d,dt){t=txt(t);l=String(l||"").trim();if(!t||!/^https?:\/\//.test(l))return null;var o=f.outlet;
 if(f.gn){var i=t.lastIndexOf(" - ");if(i>10&&t.length-i<45){o=t.slice(i+3).trim();t=t.slice(0,i).trim()}}
 return{title:t,link:l,desc:txt(d).slice(0,300),date:pdate(dt),source:f.name,outlet:o,tag:f.tag,gn:!!f.gn}}
function fromJson(j,f){if(!j||j.status!=="ok"||!j.items)return[];return j.items.map(function(i){return mk(f,i.title,i.link,i.description||i.content,i.pubDate)}).filter(Boolean)}
function fromXml(x,f){var doc=new DOMParser().parseFromString(x,"text/xml");if(doc.getElementsByTagName("parsererror").length)return[];
 var out=[];Array.prototype.forEach.call(doc.querySelectorAll("item,entry"),function(it){
  function g(n){var e=it.getElementsByTagName(n)[0];return e?e.textContent:""}
  var l=g("link");if(!l){var le=it.getElementsByTagName("link")[0];l=le?le.getAttribute("href"):""}
  var a=mk(f,g("title"),l,g("description")||g("summary")||g("content:encoded")||g("content"),g("pubDate")||g("published")||g("updated")||g("dc:date"));if(a)out.push(a)});return out}
var ST={},loading=false;
async function getFeed(f){for(var i=0;i<PROXIES.length;i++){var p=PROXIES[i];
  try{var c=new AbortController(),tm=setTimeout(function(){c.abort()},12000);var r=await fetch(p.make(f.url),{signal:c.signal});clearTimeout(tm);if(!r.ok)continue;
   var items=p.json?fromJson(await r.json(),f):fromXml(await r.text(),f);if(items.length){if(!f.quiet)ST[f.name]=p.direct?"direct":(p.json?"rss2json":"helper");return items}}catch(e){}}
  if(!f.quiet)ST[f.name]="failed";return[]}
function noteText(){var ks=Object.keys(ST),base=" Beaky checks claims only against these articles, so always read the originals.";
 if(!ks.length)return "Showing news saved a few minutes ago. Press Refresh for the latest."+base;
 var bad=ks.filter(function(k){return ST[k]==="failed"});
 return "Live from "+(ks.length-bad.length)+" of "+ks.length+" RSS feeds (BBC, Al Jazeera, The Guardian, NPR, DW, The Hindu, Google News)."+(bad.length?" Couldn’t reach: "+bad.join(", ")+".":"")+base}
function clip(s,n){return s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,"")+"…":s}
function blurb(a){if(a.gn)return "Top story on Google News, reported by "+a.outlet+".";var m=a.desc.match(/[^.!?]+[.!?]+/g)||[a.desc];return clip(m.slice(0,2).map(function(x){return x.trim()}).join(" ")||a.title,230)}
function topStories(arts,n){n=n||8;var by={},order=[];arts.filter(function(a){return a.title.length>15}).sort(function(a,b){return b.date-a.date}).forEach(function(a){if(!by[a.outlet]){by[a.outlet]=[];order.push(a.outlet)}by[a.outlet].push(a)});
 var out=[],seen={};for(var i=0;out.length<n;i++){var any=false;order.forEach(function(o){var a=by[o][i];if(a)any=true;if(!a||out.length>=n)return;var k=a.title.toLowerCase().split(/\W+/).slice(0,4).join(" ");if(!seen[k]){seen[k]=1;out.push(a)}});if(!any)break}
 return out.map(function(a){return{t:a.title,tag:a.tag,src:a.outlet,s:blurb(a),url:a.link}})}
function readCache(){try{var c=JSON.parse(localStorage.getItem(CACHE_KEY));return c&&c.articles?c:null}catch(e){return null}}
function writeCache(a){try{localStorage.setItem(CACHE_KEY,JSON.stringify({time:Date.now(),articles:a}))}catch(e){}}
function useArticles(arts,t,old){var st=topStories(arts);if(!st.length)return false;ARTICLES=arts;STORIES=st;idx=-1;renderCards();
 $("date").textContent=(old?"Offline, showing news from ":"Updated ")+new Date(t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});
 $("note").textContent=noteText();return true}
async function loadNews(force){if(loading)return;loading=true;
 try{var cached=readCache();
  if(!force&&cached&&Date.now()-cached.time<MAX_AGE&&useArticles(cached.articles,cached.time))return;
  $("date").textContent="Fetching today’s news…";ST={};
  var res=await Promise.all(FEEDS.map(getFeed)),map={},got=0;
  (cached?cached.articles:[]).forEach(function(a){map[a.link]=a});
  res.forEach(function(items){if(items.length)got++;items.forEach(function(a){map[a.link]=a})});
  var cut=Date.now()-KEEP,arts=Object.keys(map).map(function(k){return map[k]}).filter(function(a){return a.date>=cut}).sort(function(a,b){return b.date-a.date});
  if(got&&useArticles(arts,Date.now())){writeCache(arts);return}
  if(cached&&useArticles(cached.articles,cached.time,true))return;
  $("date").textContent="Saved snapshot";$("note").textContent="Couldn’t reach any news feed (are you online?), so this is a saved snapshot from Oct 22, 2026."
 }finally{loading=false}}
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);$("theme").textContent=t==="dark"?"☀️ Light":"🌙 Dark"}
var themeSaved=null;try{themeSaved=localStorage.getItem("headline_theme")}catch(e){}
var darkQ=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
applyTheme(themeSaved||(darkQ&&darkQ.matches?"dark":"light"));
if(darkQ&&darkQ.addEventListener)darkQ.addEventListener("change",function(e){if(!themeSaved)applyTheme(e.matches?"dark":"light")});
$("theme").onclick=function(){var t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";applyTheme(t);themeSaved=t;try{localStorage.setItem("headline_theme",t)}catch(e){}};
$("refresh").onclick=function(){loadNews(true)};setInterval(function(){loadNews(true)},30*60000);
renderCards();$("date").textContent="Loading today’s news…";loadNews();
voiceOn=false;say("Hi, I’m Beaky the seagull! 🐦 I read the news so you don’t have to. Press the button and I’ll tell you today’s top stories. Not sure if something is real? Type it in and I’ll check my sources!");voiceOn=true;
</script></body></html>
