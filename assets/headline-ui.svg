      <text x="26" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1e2a3c">Hi, I’m Beaky the seagull! <tspan fill="#f25f3b">🐦</tspan></text>
      <text x="26" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1e2a3c">I read the news so you don’t have to. Press the button and I’ll</text>
      <text x="26" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1e2a3c">tell you today’s top stories. Not sure if something is real? Type it in and I’ll check my sources!</text>
