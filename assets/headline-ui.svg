      <text x="22" y="38" class="tag">UKRAINE</text>
      <text x="22" y="90" class="h3">Russia hits Kyiv hours after agreeing to peace talks</text>
      <text x="22" y="162" class="p">Russia attacked Ukraine’s capital Kyiv with missiles and drones. Ukrainian officials say 1 person was killed and 22 were hurt.</text>

