      <rect x="4" y="46" width="16" height="16" fill="#5a6f8f"/>
      <text x="46" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#3c536d">Also search Google News when checking a claim (your question goes to Google, through a free helper service)</text>
