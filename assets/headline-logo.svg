  <rect width="900" height="260" fill="#efefef"/>
  <rect x="18" y="18" width="864" height="224" fill="#f8f8f8" stroke="#1a1a1a" stroke-width="10"/>
  <rect x="40" y="40" width="820" height="180" fill="#f8f8f8" stroke="#1a1a1a" stroke-width="8"/>
  <text x="450" y="165"
        text-anchor="middle"
